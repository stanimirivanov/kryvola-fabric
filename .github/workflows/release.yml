name: experimental-fabric-release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: experimental-fabric-release
  cancel-in-progress: false
jobs:
  qualify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.5"
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
      - run: uv sync --locked --extra conformance
      - run: uv run --locked --extra conformance python tools/install_temporal.py
      - run: uv run --locked --extra conformance python tools/install_release.py
      - run: uv run --locked --extra conformance python tools/verify.py full
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-wheel
          path: build/publication/*
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: m1-runtime
          path: build/m1-publication/*
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: qualify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.5"
      - uses: actions/download-artifact@v8
        with:
          name: experimental-wheel
          path: build/publication
      - uses: actions/download-artifact@v8
        with:
          name: m1-runtime
          path: build/m1-publication
      - run: uv run --locked python tools/install_release.py
      - name: Sign and verify exact publisher identity and commit
        run: |
          build/release-tools/cosign sign-blob --yes --bundle build/publication/manifest.sigstore.json build/publication/manifest.json
          uv run --locked python tools/release.py verify --source "$GITHUB_SHA"
          build/release-tools/cosign sign-blob --yes --bundle build/m1-publication/manifest.sigstore.json build/m1-publication/manifest.json
          uv run --locked python tools/runtime_release.py verify --source "$GITHUB_SHA"
      - name: Create a fresh draft, upload once, then expose the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="experimental-${GITHUB_SHA}"
          existing="$(git ls-remote --tags origin "refs/tags/$tag")"
          if [ -n "$existing" ]; then echo 'Tag exists; refusing replacement'; exit 1; fi
          if gh release view "$tag"; then echo 'Release exists; refusing replacement'; exit 1; fi
          gh release create "$tag" --target "$GITHUB_SHA" --draft --prerelease --title "$tag" --notes 'Experimental Python conformance wheel only; no production execution or security qualification.' build/publication/*
          gh release edit "$tag" --draft=false
          m1_tag="m1-${GITHUB_SHA}"
          existing="$(git ls-remote --tags origin "refs/tags/$m1_tag")"
          if [ -n "$existing" ]; then echo 'M1 tag exists; refusing replacement'; exit 1; fi
          if gh release view "$m1_tag"; then echo 'M1 release exists; refusing replacement'; exit 1; fi
          gh release create "$m1_tag" --target "$GITHUB_SHA" --draft --prerelease --title "$m1_tag" --notes 'M1 Fabric runtime packages; deployment, credentials and native owner qualification remain separate.' build/m1-publication/*
          gh release edit "$m1_tag" --draft=false

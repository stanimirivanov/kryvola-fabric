[package]
name = "kryvola-fabric-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
hex = "=0.4.3"
blake3 = "=1.8.7"
futures-util = "=0.3.34"
object_store = { version = "=0.14.2", default-features = false, features = ["aws"] }
hyper = { version = "=1.12.0", features = ["http1", "server"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
ring = "=0.17.14"
rdkafka = { version = "=0.39.0", default-features = false, features = ["ssl-vendored", "tokio"] }
serde = { version = "=1.0.229", features = ["derive"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring"] }
axum = { version = "=0.8.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "=1.54.1", features = ["io-util", "macros", "net", "rt", "signal", "time"] }
prost = "=0.14.4"
prost-reflect = { version = "=0.16.5", features = ["serde"] }
jsonschema = { version = "=0.60.1", default-features = false }
serde_json = "=1.0.154"
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring", "json", "migrate", "macros"] }
spiffe = { version = "=0.19.0", default-features = false, features = ["x509-source"] }
spiffe-rustls = { version = "=0.11.0", default-features = false, features = ["ring"] }
spiffe-rustls-tokio = { version = "=0.7.0", default-features = false }
x509-parser = { version = "=0.18.1", default-features = false }
tokio-util = { version = "=0.7.20", features = ["io"] }

[lints]
workspace = true

[dev-dependencies]
async-trait = "=0.1.92"
